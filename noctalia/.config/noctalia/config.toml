# ==============================================================================
# Noctalia v5 Shell Configuration
# Synced from local machine (Fedora 44 / Saviour Gundam) for upstream default
# ==============================================================================

config_version = 14

[accessibility]
ui_scale = 0.80000000447034836

[bar]
order = [ "Top_Bar" ]

    [bar.Top_Bar]
    center = [ "notifications", "sysmon", "ram", "temp", "bar", "activity" ]
    end = [
        "tray",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "battery",
        "clock",
        "control-center",
        "wallpaper",
        "session"
    ]
    font_scale = 0.79999998956918716
    margin_ends = 3
    scale = 0.80000000447034836
    start = [ "launcher", "workspaces", "active_window", "media" ]
    thickness = 32

[battery]
warning_threshold = 30

    [battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_0"]
    warning_threshold = 10

    [battery.device."/org/freedesktop/UPower/devices/battery_hidpp_battery_1"]
    warning_threshold = 15

[calendar]
enabled = true

    [calendar.account.colli]
    name = "Personal"
    type = "google"

    [calendar.account.u_de_chile]
    name = "Uni"
    type = "google"

