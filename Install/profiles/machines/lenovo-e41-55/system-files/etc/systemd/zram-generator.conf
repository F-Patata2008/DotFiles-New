# ==============================================================================
# zRAM CONFIGURATION FOR LENOVO E41-55 (Ryzen 3 3250U / 16GB RAM)
# Upgrades default lzo-rle to high-ratio zstd compression
# ==============================================================================

[zram0]
# Allocate up to full RAM capacity compressed in memory
zram-size = ram
# zstd achieves ~2.5x compression ratio on x86 binaries & RAM data
compression-algorithm = zstd
swap-priority = 100
