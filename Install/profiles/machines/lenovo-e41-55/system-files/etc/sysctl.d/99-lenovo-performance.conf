# ==============================================================================
# KERNEL SYSCTL PERFORMANCE TUNING (Lenovo E41-55 / Zen+ APU)
# ==============================================================================

# 1. zRAM Swapping Optimizations
# With zRAM, swapping to RAM is faster than dropping cached files.
vm.swappiness = 150

# In zRAM, reading single 4KB pages eliminates clustering latency spikes.
vm.page-cluster = 0

# 2. Filesystem & Inode Caching (Speeds up git, compilers & Neovim)
# Keep directory structures and file inodes in memory longer.
vm.vfs_cache_pressure = 50

# 3. Dirty Page Ratios for NVMe Storage
# Flushes writes sooner to prevent I/O micro-stutters under heavy compilation.
vm.dirty_background_ratio = 5
vm.dirty_ratio = 10
