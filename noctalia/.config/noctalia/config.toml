# ==============================================================================
# Noctalia v5 Shell Configuration
# Full Declarative Config (Fedora <-> Arch unified)
# ==============================================================================

[bar]
order = [ "default" ]

    [bar.default]
    background_opacity = 0.93
    center = [ "notifications", "cpu", "ram", "temp", "bar" ]
    enabled = true
    end = [
        "tray",
        "power-profile",
        "battery",
        "network",
        "bluetooth",
        "volume",
        "brightness",
        "control-center",
        "clock",
        "wallpaper"
    ]
    font_scale = 0.8
    margin_edge = 4
    margin_ends = 4
    margin_opposite_edge = 0
    padding = 6
    position = "top"
    radius = 12
    start = [ "launcher", "workspaces", "active_window", "media" ]
    thickness = 32
    widget_spacing = 6

[calendar]
enabled = true

[dock]
active_monitor_only = true
auto_hide = true
background_opacity = 0.93
enabled = true
icon_size = 24
item_spacing = 6
magnification = true
position = "right"
reserve_space = false
show_dots = true

[hooks]
colors_changed = [
    "noctalia theme -c ~/.config/noctalia/templates/templates.toml ~/.local/state/noctalia/wallpaper.png 2>/dev/null || true",
    "hyprctl reload"
]
wallpaper_changed = [
    "noctalia theme -c ~/.config/noctalia/templates/templates.toml $NOCTALIA_WALLPAPER 2>/dev/null || true",
    "hyprctl reload"
]

[location]
auto_locate = true

[lockscreen]
allow_empty_password = true
wallpaper = "~/Dotfiles/Wallpapers/Macross/4.jpg"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [ "lockscreen-login-box@eDP-1", "lockscreen-widget-0000000000000001" ]

    [lockscreen_widgets.grid]
    cell_size = 16
    major_interval = 4
    visible = true

    [lockscreen_widgets.widget."lockscreen-login-box@eDP-1"]
    box_height = 196.0
    box_width = 810.0
    cx = 411.0
    cy = 594.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "login_box"

        [lockscreen_widgets.widget."lockscreen-login-box@eDP-1".settings]
        background_color = "surface_variant"
        background_opacity = 0.88
        background_radius = 12.0
        center_password_text = false
        input_opacity = 1.0
        input_radius = 6.0
        layout = "regular"
        show_caps_lock = true
        show_keyboard_layout = true
        show_login_button = true
        show_media = true
        show_session_buttons = true
        show_unlock_hint = true
        show_weather = true

    [lockscreen_widgets.widget.lockscreen-widget-0000000000000001]
    box_height = 144.0
    box_width = 352.0
    cx = 187.0
    cy = 104.0
    output = "eDP-1"
    placement_height = 768.0
    placement_width = 1366.0
    rotation = 0.0
    type = "clock"

        [lockscreen_widgets.widget.lockscreen-widget-0000000000000001.settings]
        format = "{:%H:%M:%S}"

[nightlight]
enabled = true

[notification]
position = "top_center"

[osd]
position = "bottom_center"
position_vertical = "bottom_right"

[plugins]
enabled = [ "icefish/phone-connect" ]

[shell]
corner_radius_scale = 1.0
font_family = "sans-serif"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = true
time_format = "{:%H:%M:%S}"

    [shell.keyboard_layout.custom_labels]
    "Spanish (Latin American)" = "LA"

    [shell.launcher]
    categories = true
    compact = true
    show_icons = true
    sort_by_usage = true

    [shell.panel]
    borders = true
    shadow = true

[theme]
builtin = "Ayu"
mode = "dark"
source = "wallpaper"
wallpaper_scheme = "m3-content"

    [theme.templates]
    builtin_ids = [ "btop", "gtk3", "gtk4", "hyprland", "kitty", "niri", "qt", "sway" ]
    community_ids = [
        "zen-browser",
        "pywalfox",
        "discord",
        "telegram",
        "neovim",
        "vscode",
        "heroiclauncher",
        "steam",
        "fuzzel",
        "zathura",
        "yazi"
    ]

[wallpaper]
directory = "~/Dotfiles/Wallpapers/Gundam"
fill_mode = "crop"
transition = [ "fade", "wipe", "disc", "stripes", "zoom", "honeycomb" ]
transition_duration = 1500.0

    [wallpaper.default]
    path = "~/Dotfiles/Wallpapers/Gundam/10.jpg"

    [wallpaper.last]
    path = "~/Dotfiles/Wallpapers/Gundam/10.jpg"

[widget.bar]
type = "icefish/phone-connect:bar"
