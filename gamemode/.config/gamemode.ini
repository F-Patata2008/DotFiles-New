[general]
; The renice value(0-20), will be subtracted from current nice value
renice=5

; Inhibit screensaver and sleep
inhibit_screensaver=1

[custom]
; Tuned integration for Lenovo E41-55 (Ryzen 3 3250U / Vega 3)
; Shifts CPU governor and platform profile to max throughput
start=tuned-adm profile throughput-performance && notify-send -a "GameMode" "⚔️ Combat Mode Engaged" "Profile: throughput-performance\nGovernor: Performance"
end=tuned-adm profile powersave && notify-send -a "GameMode" "🛡️ Combat Mode Disengaged" "Profile: powersave\nGovernor: Powersave"
