[nightlight]
enabled = true

[notification]
position = "top_center"

[osd]
position = "bottom_center"

[plugins]
enabled = [ "alexmnrs/github-activity", "icefish/phone-connect" ]

[shell]
corner_radius_scale = 0.80000001192092896
font_family = "JetBrainsMono NF"
password_style = "random"
polkit_agent = true
screen_time_enabled = true
telemetry_enabled = true
time_format = "{:%H:%M:%S}"

    [shell.launcher]
    pinned = [ "zen-browser", "kitty", "steam", "spotify" ]
    show_app_actions = true

    [shell.panel]
    transparency_mode = "glass"

[theme]
builtin = "Ayu"
community_palette = "Oxocarbon"
mode = "dark"
source = "builtin"
wallpaper_scheme = "soft"

    [theme.templates]
    builtin_ids = [ "btop", "cava", "gtk3", "gtk4", "hyprland", "kitty", "qt" ]
    community_ids = [
        "antigravity",
        "spicetify",
        "zen-browser",
        "telegram",
        "gimp",
        "steam",
        "fuzzel",
        "rofi",
        "fastfetch",
        "zathura",
        "hyprtoolkit",
        "fzf",
        "yazi"
    ]

[wallpaper]
directory = "~/Dotfiles/Wallpapers"

    [wallpaper.default]
    path = "~/Dotfiles/Wallpapers/Gundam/10.jpg"

    [wallpaper.last]
    path = "~/Dotfiles/Wallpapers/Gundam/10.jpg"

    [wallpaper.monitors.eDP-1]
    path = "~/Dotfiles/Wallpapers/Gundam/10.jpg"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "~/Dotfiles/Wallpapers/Macross/8.jpeg"
    theme_mode = "dark"
    wallpaper_scheme = "soft"

    [[wallpaper.favorite]]
    builtin_palette = "Ayu"
    palette_source = "builtin"
    path = "~/Dotfiles/Wallpapers/Gundam/10.jpg"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    builtin_palette = "Ayu"
    palette_source = "builtin"
    path = "~/Dotfiles/Wallpapers/Gundam/20.jpg"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    builtin_palette = "Ayu"
    palette_source = "builtin"
    path = "~/Dotfiles/Wallpapers/Gundam/37.jpg"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "~/Dotfiles/Wallpapers/Gundam/36.png"
    theme_mode = "dark"
    wallpaper_scheme = "soft"

    [[wallpaper.favorite]]
    builtin_palette = "Ayu"
    palette_source = "builtin"
    path = "~/Dotfiles/Wallpapers/Miku/Miku10.jpg"
    theme_mode = "dark"

    [[wallpaper.favorite]]
    palette_source = "wallpaper"
    path = "~/Dotfiles/Wallpapers/Gundam/34.png"
    theme_mode = "dark"
    wallpaper_scheme = "soft"

[widget.activity]
enabled = false
type = "alexmnrs/github-activity:activity"

[widget.bar]
type = "icefish/phone-connect:bar"

[widget.media]
hide_when_no_media = true