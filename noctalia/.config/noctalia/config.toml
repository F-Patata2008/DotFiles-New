[hooks]
colors_changed = [
    "noctalia theme -c ~/.config/noctalia/templates/templates.toml ~/.local/state/noctalia/wallpaper.png 2>/dev/null || true",
    "hyprctl reload"
]
wallpaper_changed = [
    "noctalia theme -c ~/.config/noctalia/templates/templates.toml $NOCTALIA_WALLPAPER 2>/dev/null || true",
    "hyprctl reload"
]

[dock]
active_monitor_only = true
enabled = true
icon_size = 24
layer = "overlay"
pinned = [ "kitty", "zen-browser", "steam" ]
position = "right"
reserve_space = false
show_dots = true
smart_auto_hide = true

[hot_corners]
enabled = true

[idle]
behavior_order = [ "lock", "screen-off", "lock-and-suspend" ]
pre_action_fade_seconds = 4

    [idle.behavior.lock]
    action = "lock"
    enabled = true
    timeout = 300.0

    [idle.behavior.lock-and-suspend]
    action = "lock_and_suspend"
    enabled = true
    timeout = 600.0

    [idle.behavior.screen-off]
    action = "screen_off"
    enabled = true
    timeout = 120.0

[location]
auto_locate = true

[lockscreen]
wallpaper = "~/Dotfiles/Wallpapers/Gundam/33.jpg"

[lockscreen_widgets]
enabled = true
schema_version = 2
widget_order = [
    "lockscreen-login-box@eDP-1",
    "lockscreen-widget-0000000000000001",
    "lockscreen-widget-0000000000000002",
    "lockscreen-widget-0000000000000003",
    "lockscreen-widget-0000000000000004",
    "lockscreen-widget-0000000000000005"
